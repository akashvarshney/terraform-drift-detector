[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-drift-agent"
version = "0.2.0"
description = "Observe-first Terraform drift agent: detect, classify, propose a reviewed patch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Azure Activity Log correlation and managed-identity tokens for Foundry/Graph.
azure = [
  "azure-identity>=1.16",
  "azure-mgmt-monitor>=6.0",
]
# GitHub App installation tokens (RS256 JWT signing).
github = [
  "cryptography>=42",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
drift-agent = "drift_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["drift_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
