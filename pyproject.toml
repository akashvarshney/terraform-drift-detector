[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-drift-agent"
version = "0.1.0"
description = "Minimal observe-only Terraform drift worker"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
drift-agent = "drift_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]